name: Reusable edge image and chart publication
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      version:
        type: string
        default: ''
      chart-version:
        type: string
        default: ''
      plugins-ref:
        type: string
        default: ''
      publish:
        type: boolean
        default: true
jobs:
  inputs:
    runs-on: ubuntu-latest
    outputs:
      plugins_ref: ${{ steps.plugins.outputs.plugins_ref }}
      plugins_revision: ${{ steps.plugins.outputs.plugins_revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Resolve plugins version/tag to a commit
        id: plugins
        env:
          PLUGINS_REF: ${{ inputs.plugins-ref }}
        run: python3 .github/scripts/edge_inputs.py --plugins-ref "$PLUGINS_REF"
  image:
    needs: inputs
    uses: ./.github/workflows/.build.yml
    with:
      name: sdx-access-point
      context: .
      file: sdx/image/Dockerfile
      ref: ${{ inputs.ref }}
      version: ${{ inputs.version }}
      publish: ${{ inputs.publish }}
      build-args: |
        KONG_PLUGINS_REF=${{ needs.inputs.outputs.plugins_ref }}
        KONG_PLUGINS_REVISION=${{ needs.inputs.outputs.plugins_revision }}
  chart:
    needs: image
    if: inputs.publish
    uses: ./.github/workflows/.chart.yml
    with:
      ref: ${{ inputs.ref }}
      version: ${{ inputs.chart-version }}
      edge-image: ${{ needs.image.outputs.image }}
      image-digest: ${{ needs.image.outputs.digest }}
