name: All APE Functions

on:
  push:
    branches: ['feature/**', dev]

  pull_request:
    branches: [dev, main]

jobs:
  build-opal-pip-catalog:
    uses: ./.github/workflows/.build.yml
    permissions:
      contents: read
      packages: write
    with:
      name: opal-pip-catalog
      publish: ${{ github.event_name == 'push' }}
      context: ./sdx/ape/functions/opal-pip-catalog

  build-opal-policies:
    uses: ./.github/workflows/.build.yml
    permissions:
      contents: read
      packages: write
    with:
      name: opal-policies
      publish: ${{ github.event_name == 'push' }}
      context: ./sdx/ape/functions/opal-policies

  build-pubsub-kafka:
    uses: ./.github/workflows/.build.yml
    permissions:
      contents: read
      packages: write
    with:
      name: pubsub-kafka
      publish: ${{ github.event_name == 'push' }}
      context: ./sdx/ape/functions/pubsub-kafka

  build-pubsub-webhook:
    uses: ./.github/workflows/.build.yml
    permissions:
      contents: read
      packages: write
    with:
      name: pubsub-webhook
      publish: ${{ github.event_name == 'push' }}
      context: ./sdx/ape/functions/pubsub-webhook
