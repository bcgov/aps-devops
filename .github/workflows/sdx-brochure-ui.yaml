name: SDX Brochure UI

on:
  push:
    branches: ['feature/**', dev]
    paths:
      - 'sdx/brochure-ui/**'
      - '.github/workflows/sdx-brochure-ui.yaml'
      - '.github/workflows/.build.yml'

  pull_request:
    branches: [dev, main]
    paths:
      - 'sdx/brochure-ui/**'
      - '.github/workflows/sdx-brochure-ui.yaml'
      - '.github/workflows/.build.yml'

jobs:
  build-brochure-ui:
    uses: ./.github/workflows/.build.yml
    permissions:
      contents: read
      packages: write
    with:
      name: sdx-ui
      publish: ${{ github.event_name == 'push' }}
      context: ./sdx/brochure-ui
