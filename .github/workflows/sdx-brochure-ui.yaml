name: SDX Brochure UI

on:
  push:
    branches: ['feature/**', dev]

  pull_request:
    branches: [dev, main]

jobs:
  build-brochure-ui:
    uses: ./.github/workflows/.build.yml
    permissions:
      contents: read
      packages: write
    with:
      name: sdx-ui
      publish: ${{ github.event_name == 'push' }}
      context: ./sdx/brochure-ui
