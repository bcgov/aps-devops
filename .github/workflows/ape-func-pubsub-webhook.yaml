name: APE Function — pubsub-webhook

on:
  push:
    branches: ['feature/**', dev]
    paths:
      - 'sdx/ape/functions/pubsub-webhook/**'
      - '.github/workflows/ape-func-pubsub-webhook.yaml'
      - '.github/workflows/.build.yml'

  pull_request:
    branches: [dev, main]
    paths:
      - 'sdx/ape/functions/pubsub-webhook/**'
      - '.github/workflows/ape-func-pubsub-webhook.yaml'
      - '.github/workflows/.build.yml'

jobs:
  build-pubsub-webhook:
    uses: ./.github/workflows/.build.yml
    permissions:
      contents: read
      packages: write
    with:
      name: pubsub-webhook
      publish: ${{ github.event_name == 'push' }}
      context: ./sdx/ape/functions/pubsub-webhook
