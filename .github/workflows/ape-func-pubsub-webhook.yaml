name: APE Function — pubsub-webhook

on:
  push:
    branches: ['feature/**', dev]

  pull_request:
    branches: [dev, main]

jobs:
  build-pubsub-webhook:
    uses: ./.github/workflows/.build.yml
    permissions:
      contents: read
      packages: write
    with:
      name: pubsub-webhook
      publish: ${{ github.event_name == 'push' }}
      context: ./sdx/ape/functions/pubsub-webhook
