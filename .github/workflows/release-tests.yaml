name: Release tooling tests
on:
  pull_request: {}
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  planner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.1
      - run: python3 -m unittest discover -s tests/release -v
