name: APE Function — opal-policies

on:
  push:
    branches: ['feature/**', dev]

  pull_request:
    branches: [dev, main]

jobs:
  build-opal-policies:
    uses: ./.github/workflows/.build.yml
    permissions:
      contents: read
      packages: write
    with:
      name: opal-policies
      publish: ${{ github.event_name == 'push' }}
      context: ./sdx/ape/functions/opal-policies
