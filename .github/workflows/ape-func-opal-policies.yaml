name: APE Function — opal-policies

on:
  push:
    branches: ['feature/**', dev]
    paths:
      - 'sdx/ape/functions/opal-policies/**'
      - '.github/workflows/ape-func-opal-policies.yaml'
      - '.github/workflows/.build.yml'

  pull_request:
    branches: [dev, main]
    paths:
      - 'sdx/ape/functions/opal-policies/**'
      - '.github/workflows/ape-func-opal-policies.yaml'
      - '.github/workflows/.build.yml'

jobs:
  build-opal-policies:
    uses: ./.github/workflows/.build.yml
    permissions:
      contents: read
      packages: write
    with:
      name: opal-policies
      publish: ${{ github.event_name == 'push' }}
      context: ./sdx/ape/functions/opal-policies
