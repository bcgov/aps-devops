name: SDX edge image and chart
on:
  push:
    branches: ['feature/**', dev, 'images/**']
    paths:
      - 'sdx/image/**'
      - 'sdx/chart/sdx-edge/**'
      - '.github/workflows/sdx-image.yaml'
      - '.github/workflows/.edge.yml'
      - '.github/workflows/.build.yml'
      - '.github/workflows/.chart.yml'
  pull_request:
    branches: [dev, main]
    paths:
      - 'sdx/image/**'
      - 'sdx/chart/sdx-edge/**'
      - '.github/workflows/sdx-image.yaml'
      - '.github/workflows/.edge.yml'
      - '.github/workflows/.build.yml'
      - '.github/workflows/.chart.yml'
  workflow_dispatch:
    inputs:
      plugins_ref:
        description: 'Plugins release tag or full commit (empty uses sdx/image/plugins.json)'
        type: string
        default: ''
jobs:
  edge:
    uses: ./.github/workflows/.edge.yml
    permissions:
      contents: read
      packages: write
    with:
      plugins-ref: ${{ inputs.plugins_ref || '' }}
      publish: ${{ github.event_name != 'pull_request' }}
