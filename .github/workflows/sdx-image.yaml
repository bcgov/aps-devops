name: SDX edge image
on:
  push:
    branches: ['feature/**', dev, 'images/**']
  pull_request:
    branches: [dev, main]
  workflow_dispatch: {}
jobs:
  edge:
    uses: ./.github/workflows/.build.yml
    permissions:
      contents: read
      packages: write
    with:
      name: sdx-access-point
      context: .
      file: sdx/image/Dockerfile
      publish: ${{ github.event_name != 'pull_request' }}
