name: APE Function — opal-pip-catalog

on:
  push:
    branches: ['feature/**', dev]
    paths:
      - 'sdx/ape/functions/opal-pip-catalog/**'
      - '.github/workflows/ape-func-opal-pip-catalog.yaml'
      - '.github/workflows/.build.yml'

  pull_request:
    branches: [dev, main]
    paths:
      - 'sdx/ape/functions/opal-pip-catalog/**'
      - '.github/workflows/ape-func-opal-pip-catalog.yaml'
      - '.github/workflows/.build.yml'

jobs:
  build-opal-pip-catalog:
    uses: ./.github/workflows/.build.yml
    permissions:
      contents: read
      packages: write
    with:
      name: opal-pip-catalog
      publish: ${{ github.event_name == 'push' }}
      context: ./sdx/ape/functions/opal-pip-catalog
