name: Component releases
on:
  pull_request:
    branches: [main]
    types: [closed]
permissions:
  contents: read
concurrency:
  group: component-releases
  cancel-in-progress: false
jobs:
  plan:
    if: github.event.pull_request.merged && github.event.pull_request.head.ref == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      images: ${{ steps.plan.outputs.images }}
      has_images: ${{ steps.plan.outputs.has_images }}
      has_edge: ${{ steps.plan.outputs.has_edge }}
      has_chart: ${{ steps.plan.outputs.has_chart }}
      has_components: ${{ steps.plan.outputs.has_components }}
      chart_version: ${{ steps.plan.outputs.chart_version }}
      edge_version: ${{ steps.plan.outputs.edge_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global semver@7.7.3
      - id: plan
        run: bash .github/scripts/release-plan.sh
      - name: Reserve immutable component tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          while IFS= read -r TAG; do
            if git rev-parse "$TAG" > /dev/null 2>&1; then
              test "$(git rev-parse "$TAG^{commit}")" = "$(git rev-parse HEAD)"
            else
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$(git rev-parse HEAD)"
            fi
          done < <(jq -r '.[].tag' release-plan.json)
      - uses: actions/upload-artifact@v4
        with:
          name: release-plan
          path: release-plan.json
  images:
    needs: plan
    if: needs.plan.outputs.has_images == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.images) }}
    uses: ./.github/workflows/.build.yml
    permissions:
      contents: read
      packages: write
    with:
      name: ${{ matrix.name }}
      context: ${{ matrix.context }}
      file: ${{ matrix.file }}
      version: ${{ matrix.version }}
      ref: ${{ github.event.pull_request.merge_commit_sha }}
  edge:
    needs: plan
    if: needs.plan.outputs.has_edge == 'true'
    uses: ./.github/workflows/.edge.yml
    permissions:
      contents: read
      packages: write
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha }}
      version: ${{ needs.plan.outputs.edge_version }}
      chart-version: ${{ needs.plan.outputs.chart_version }}
  chart:
    needs: plan
    if: needs.plan.outputs.has_chart == 'true' && needs.plan.outputs.has_edge != 'true'
    uses: ./.github/workflows/.chart.yml
    permissions:
      contents: read
      packages: write
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha }}
      version: ${{ needs.plan.outputs.chart_version }}
  notes:
    needs: [plan, images, edge, chart]
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' &&
      needs.plan.outputs.has_components == 'true' &&
      (needs.images.result == 'success' || needs.images.result == 'skipped') &&
      (needs.chart.result == 'success' || needs.chart.result == 'skipped') &&
      (needs.edge.result == 'success' || needs.edge.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.has_chart == 'true'
        with:
          name: chart-sdx-edge
          path: dist
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish component tags and release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          SOURCE_SHA=$(git rev-parse HEAD)
          while IFS= read -r COMPONENT; do
            TAG=$(jq -r .tag <<< "$COMPONENT")
            NAME=$(jq -r .name <<< "$COMPONENT")
            PREVIOUS=$(jq -r .previous <<< "$COMPONENT")
            KIND=$(jq -r .kind <<< "$COMPONENT")
            if DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
              test "$DRAFT" = false || { echo "Resume draft $TAG with gh release upload/edit before retrying." >&2; exit 1; }
              continue
            fi
            PATHS=()
            while IFS= read -r P; do PATHS+=("$P"); done < <(jq -r '.paths[]' <<< "$COMPONENT")
            while IFS= read -r P; do PATHS+=("$P"); done < <(jq -r '.shared_paths[]' .github/release/components.json)
            printf 'Source: %s\nPromotion: %s\n\n' "$SOURCE_SHA" "$PR_URL" > notes.md
            git log --format='- %s (%h)' "${PREVIOUS:+$PREVIOUS..}$SOURCE_SHA" -- "${PATHS[@]}" >> notes.md
            ASSETS=()
            if [[ "$KIND" == chart ]]; then
              ASSETS=(dist/*)
            else
              VERSION=$(jq -r .version <<< "$COMPONENT")
              IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/$NAME:v$VERSION"
              DIGEST=$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')
              printf '\nImage: %s@%s\n' "${IMAGE%:*}" "$DIGEST" >> notes.md
            fi
            gh release create "$TAG" "${ASSETS[@]}" --verify-tag --title "$TAG" --notes-file notes.md --latest=false
          done < <(jq -c '.[]' release-plan.json)
