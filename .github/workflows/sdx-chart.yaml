name: SDX chart validation
on:
  push:
    branches: ['feature/**', dev]
    paths:
      - 'sdx/chart/**'
      - '.github/workflows/sdx-chart.yaml'
      - '.github/workflows/.chart.yml'
  pull_request:
    branches: [dev, main]
    paths:
      - 'sdx/chart/**'
      - '.github/workflows/sdx-chart.yaml'
      - '.github/workflows/.chart.yml'
permissions:
  contents: read
jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v5
        with:
          version: v3.19.1
      - run: |
          helm lint sdx/chart/sdx-edge
          helm template release-check sdx/chart/sdx-edge > /dev/null
          helm template release-check sdx/chart/sdx-edge --set use_openshift_resources=false > /dev/null
          helm template release-check sdx/chart/sdx-edge --set-string kong.imageDigest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa > digest-render.yaml
          test "$(grep -c 'image:.*sdx-access-point@sha256:aaaaaaaa' digest-render.yaml)" = 2
