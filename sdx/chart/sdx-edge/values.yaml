nginx_conf: |-
  set $session_storage             shm;
  set $session_secret              1234123412341234;

shared:
  rbac: true

  ca_secret: true

  fluentbit:
    enabled: true

  prometheus:
    enabled: true

  # mTLS to Gold gwmetricsaggregator (same client cert material as Fluent Bit → gwaggregator)
  tls:
    enabled: true

  # Per-edge identity automatically added in the `runtimegroup` label.
  # Optional extra labels added to every series before remote_write (e.g. datacenter).
  external_labels:
    datacenter: edge

  # Prometheus remote_write queue tuning. Defaults are conservative and aimed
  # at a single edge with low-to-moderate traffic; tune up for busy edges.
  # See https://prometheus.io/docs/practices/remote_write/
  queue_config:
    max_samples_per_send: 1000
    capacity: 10000
    max_shards: 30

aws:
  enabled: false
  region: us-west-2
  # AWS_ACCESS_KEY_ID
  access_key_id:
  # AWS_SECRET_ACCESS_KEY
  secret_access_key:

opal:
  openshift:
    enabled: true
    securityContext: {}
    containerSecurityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false

