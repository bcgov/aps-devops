name: example

hpa:
  minReplicas: 1
  maxReplicas: 1

# Edge server host used for routing to the edge service
route:
  host: example.servers.sdx

mtls_required: true

https_proxy: ""
# https_proxy: "http://swpxkam.gov.bc.ca:8080"

use_openshift_resources: true

kong:
  enabled: true

bootstrap:
  tls:
    token: ""
    cn: "example.com"

    # Added as a SAN to the edge certificate
    ip: ""

  # Write {release}-client-next instead of live client/server secrets and skip
  # Kong restart. Use after generating a new key/CSR so the public key can be
  # published (operation=rotate) before the private key is mounted.
  stageSecret: false
  # Skip Kong restart after writing live bootstrap secrets.
  deferRestart: false

renewal:
  # Certificate renewal keeps the same private key. Restart afterwards so Kong
  # picks up the new certificate; set true only when restart is handled separately.
  deferRestart: false

rotation:
  # Copy {release}-client-next onto live client and server TLS secrets, then
  # rolling-restart Kong. Bump nonce so Helm creates a new Job on each promote.
  promote: false
  nonce: "1"

environment: prod

sdx_control_url_by_env:
  apsdev: sdx-cluster-api-gov-bc-ca.dev.api.gov.bc.ca:443
  apstst: sdx-cluster-api-gov-bc-ca.test.api.gov.bc.ca:443
  dev: sdx-cluster.dev.api.gov.bc.ca:443
  test: sdx-cluster.test.api.gov.bc.ca:443
  prod: sdx-cluster.api.gov.bc.ca:443

client_ca_url_by_env:
  apsdev: https://sdx-ca-api-gov-bc-ca.dev.api.gov.bc.ca
  apstst: https://sdx-ca-api-gov-bc-ca.test.api.gov.bc.ca
  dev: https://sdx-ca.dev.api.gov.bc.ca
  test: https://sdx-ca.test.api.gov.bc.ca
  prod: https://sdx-ca.api.gov.bc.ca

sdx_aggregator_url_by_env:
  apsdev: gwaggregator-api-gov-bc-ca.dev.api.gov.bc.ca
  apstst: gwaggregator-api-gov-bc-ca.test.api.gov.bc.ca
  dev: gwaggregator.api.gov.bc.ca
  test: gwaggregator.api.gov.bc.ca
  prod: gwaggregator.api.gov.bc.ca

# Ship the Edge Prometheus time series to a remote Prometheus (e.g. on Gold)
# via the Prometheus remote_write protocol.
prom_remote_write:
  url_by_env:
    apsdev: "https://gw-metrics-aggregator-api-gov-bc-ca.dev.api.gov.bc.ca/api/v1/write"
    apstst: "https://gw-metrics-aggregator-api-gov-bc-ca.test.api.gov.bc.ca/api/v1/write"
    dev: "https://gw-metrics-aggregator.api.gov.bc.ca/api/v1/write"
    test: "https://gw-metrics-aggregator.api.gov.bc.ca/api/v1/write"
    prod: "https://gw-metrics-aggregator.gov.bc.ca/api/v1/write"

  # mTLS to Gold gwmetricsaggregator (same client cert material as Fluent Bit → gwaggregator)
  tls:
    enabled: true

  # Per-edge identity automatically added in the `runtimegroup` label.
  # Optional extra labels added to every series before remote_write (e.g. datacenter).
  external_labels:
    datacenter: edge

  # Prometheus remote_write queue tuning. Defaults are conservative and aimed
  # at a single edge with low-to-moderate traffic; tune up for busy edges.
  # See https://prometheus.io/docs/practices/remote_write/
  queue_config:
    max_samples_per_send: 1000
    capacity: 10000
    max_shards: 30

