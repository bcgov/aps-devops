{{ if .Values.shared.prometheus.enabled }}
kind: StatefulSet
apiVersion: apps/v1
metadata:
  name: sdx-prometheus-server
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/component: server
    spec:
      restartPolicy: Always
      schedulerName: default-scheduler
      enableServiceLinks: true
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - prometheus
                  - key: component
                    operator: In
                    values:
                      - server
              topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 300
      serviceAccountName: sdx-prometheus
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
      containers:
        - resources:
            limits:
              memory: 200Mi
            requests:
              cpu: 50m
              memory: 100Mi
          readinessProbe:
            tcpSocket:
              port: 9090
            initialDelaySeconds: 10
            timeoutSeconds: 4
            periodSeconds: 5
            successThreshold: 1
            failureThreshold: 120
          terminationMessagePath: /dev/termination-log
          name: prometheus-server
          livenessProbe:
            tcpSocket:
              port: 9090
            initialDelaySeconds: 10
            timeoutSeconds: 10
            periodSeconds: 15
            successThreshold: 1
            failureThreshold: 120
          ports:
            - containerPort: 9090
              protocol: TCP
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config
            - name: storage-volume
              mountPath: /data
          terminationMessagePolicy: File
          image: 'quay.io/prometheus/prometheus:v2.48.1'
          args:
            - '--storage.tsdb.retention.time=4h'
            - '--config.file=/etc/config/prometheus.yml'
            - '--storage.tsdb.path=/data'
            - '--web.console.libraries=/etc/prometheus/console_libraries'
            - '--web.console.templates=/etc/prometheus/consoles'
            - '--web.enable-lifecycle'
            - '--log.level=info'
      volumes:
        - name: config-volume
          configMap:
            name: sdx-prometheus-server
            defaultMode: 420
        - name: storage-volume
          emptyDir: {}
      dnsPolicy: ClusterFirst
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  revisionHistoryLimit: 10
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: sdx-prometheus-server
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: server
data:
  alerting_rules.yml: |
    {}
  alerts: |
    {}
  allow-snippet-annotations: 'false'
  prometheus.yml: |
    global:
      evaluation_interval: 5s
      scrape_interval: 15s
      scrape_timeout: 4s
    rule_files:
    - /etc/config/recording_rules.yml
    - /etc/config/alerting_rules.yml
    - /etc/config/rules
    - /etc/config/alerts
    scrape_configs:
    - job_name: kubernetes-kong
      kubernetes_sd_configs:
      - namespaces:
          own_namespace: true
        role: service
      - namespaces:
          own_namespace: true
        role: pod
        selectors:
        - field: status.phase=Running
          label: app.kubernetes.io/name=sdx-edge
          role: pod
      metrics_path: /metrics
      relabel_configs:
      - action: keep
        regex: (3001)
        source_labels:
        - __meta_kubernetes_pod_container_port_number
      - action: replace
        source_labels:
        - __meta_kubernetes_pod_name
        target_label: instance
      - replacement: emerald
        source_labels:
        - __address__
        target_label: datacenter

    - job_name: kubernetes-fluentd
      kubernetes_sd_configs:
      - namespaces:
          own_namespace: true
        role: pod
        selectors:
        - field: status.phase=Running
          label: app.kubernetes.io/name=log-aggregator
          role: pod
      metrics_path: /metrics
      relabel_configs:
      - action: keep
        regex: (3001)
        source_labels:
        - __meta_kubernetes_pod_container_port_number
      - action: replace
        source_labels:
        - __meta_kubernetes_pod_name
        target_label: instance
      sample_limit: 0
      scrape_interval: 60s
      scrape_timeout: 50s
  recording_rules.yml: |
    {}
  rules: |
    {}
---
kind: ServiceAccount
apiVersion: v1
metadata:
  name: sdx-prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sdx-prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: server
rules:
  - verbs:
      - list
      - get
      - watch
    apiGroups:
      - ''
    resources:
      - pods
      - services
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: sdx-prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sdx-prometheus
subjects:
  - kind: ServiceAccount
    name: sdx-prometheus
{{ end }}