{{ if .Values.shared.prometheus.enabled }}
kind: StatefulSet
apiVersion: apps/v1
metadata:
  name: sdx-prometheus-server
  labels:
    app.kubernetes.io/name: sdx-edge
    app.kubernetes.io/component: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sdx-edge
      app.kubernetes.io/component: prometheus
  template:
    metadata:
      labels:
        DataClass: Low
        app.kubernetes.io/name: sdx-edge
        app.kubernetes.io/component: prometheus
    spec:
      restartPolicy: Always
      schedulerName: default-scheduler
      enableServiceLinks: true
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - prometheus
                  - key: component
                    operator: In
                    values:
                      - server
              topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 300
      serviceAccountName: sdx-prometheus
      automountServiceAccountToken: true
      securityContext: {}
        # runAsNonRoot: true
        # runAsUser: 65534
      containers:
        - resources:
            limits:
              memory: 200Mi
            requests:
              cpu: 50m
              memory: 100Mi
          readinessProbe:
            tcpSocket:
              port: 9090
            initialDelaySeconds: 10
            timeoutSeconds: 4
            periodSeconds: 5
            successThreshold: 1
            failureThreshold: 120
          terminationMessagePath: /dev/termination-log
          name: prometheus-server
          livenessProbe:
            tcpSocket:
              port: 9090
            initialDelaySeconds: 10
            timeoutSeconds: 10
            periodSeconds: 15
            successThreshold: 1
            failureThreshold: 120
          ports:
            - containerPort: 9090
              protocol: TCP
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config
            - name: storage-volume
              mountPath: /data
            {{- if and (index .Values.prom_remote_write.url_by_env .Values.environment) .Values.prom_remote_write.tls.enabled }}
            - name: sdx-edge-client-cert
              mountPath: /etc/secrets/sdx-edge-client-cert
              readOnly: true
            - name: sdx-ca
              mountPath: /etc/secrets/sdx-ca
              readOnly: true
            {{- end }}
          terminationMessagePolicy: File
          image: 'quay.io/prometheus/prometheus:v2.48.1'
          args:
            - '--storage.tsdb.retention.time=4h'
            - '--config.file=/etc/config/prometheus.yml'
            - '--storage.tsdb.path=/data'
            - '--web.console.libraries=/etc/prometheus/console_libraries'
            - '--web.console.templates=/etc/prometheus/consoles'
            - '--web.enable-lifecycle'
            - '--log.level=info'
      volumes:
        - name: config-volume
          configMap:
            name: sdx-prometheus-server
            defaultMode: 420
        - name: storage-volume
          emptyDir: {}
        {{- if and (index .Values.prom_remote_write.url_by_env .Values.environment) .Values.prom_remote_write.tls.enabled }}
        - name: sdx-edge-client-cert
          secret:
            secretName: {{ include "sdx-edge.fullname" . }}-client
        - name: sdx-ca
          secret:
            secretName: sdx-public-ca
        {{- end }}
      dnsPolicy: ClusterFirst
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  revisionHistoryLimit: 10
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: sdx-prometheus-server
  labels:
    app.kubernetes.io/name: sdx-edge
    app.kubernetes.io/component: prometheus
data:
  alerting_rules.yml: |
    {}
  alerts: |
    {}
  allow-snippet-annotations: 'false'
  prometheus.yml: |
    global:
      evaluation_interval: 5s
      scrape_interval: 15s
      scrape_timeout: 4s
      {{- if (index .Values.prom_remote_write.url_by_env .Values.environment) }}
      external_labels:
        {{- range $k, $v := .Values.prom_remote_write.external_labels }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
      {{- end }}
    rule_files:
    - /etc/config/recording_rules.yml
    - /etc/config/alerting_rules.yml
    - /etc/config/rules
    - /etc/config/alerts
    {{- if (index .Values.prom_remote_write.url_by_env .Values.environment) }}
    remote_write:
    - url: {{ (index .Values.prom_remote_write.url_by_env .Values.environment) | quote }}
      {{- if .Values.prom_remote_write.tls.enabled }}
      tls_config:
        ca_file: /etc/secrets/sdx-ca/ca.crt
        cert_file: /etc/secrets/sdx-edge-client-cert/tls.crt
        key_file: /etc/secrets/sdx-edge-client-cert/tls.key
        insecure_skip_verify: false
      {{- end }}
      {{- with .Values.prom_remote_write.queue_config }}
      queue_config:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    scrape_configs:
    - job_name: kubernetes-kong
      kubernetes_sd_configs:
      - namespaces:
          own_namespace: true
        role: service
      - namespaces:
          own_namespace: true
        role: pod
        selectors:
        - field: status.phase=Running
          label: app.kubernetes.io/name=sdx-edge
          role: pod
      metrics_path: /metrics
      relabel_configs:
      - action: keep
        regex: (8100)
        source_labels:
        - __meta_kubernetes_pod_container_port_number
      - action: replace
        source_labels:
        - __meta_kubernetes_pod_name
        target_label: instance
      - action: replace
        source_labels:
        - __meta_kubernetes_pod_label_runtime_group
        target_label: runtimegroup

    - job_name: kubernetes-fluentd
      kubernetes_sd_configs:
      - namespaces:
          own_namespace: true
        role: pod
        selectors:
        - field: status.phase=Running
          label: app.kubernetes.io/name=fluentbit
          role: pod
      metrics_path: /metrics
      relabel_configs:
      - action: keep
        regex: (2021)
        source_labels:
        - __meta_kubernetes_pod_container_port_number
      - action: replace
        source_labels:
        - __meta_kubernetes_pod_name
        target_label: instance
  recording_rules.yml: |
    {}
  rules: |
    {}
---
kind: Service
apiVersion: v1
metadata:
  name: sdx-prometheus-server
  labels:
    app.kubernetes.io/name: sdx-edge
    app.kubernetes.io/component: prometheus
spec:
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 9090
    - name: grpc
      protocol: TCP
      port: 10901
      targetPort: 10901
  type: ClusterIP
  sessionAffinity: None
  selector:
    app.kubernetes.io/name: sdx-edge
    app.kubernetes.io/component: prometheus
---
kind: ServiceAccount
apiVersion: v1
metadata:
  name: sdx-prometheus
  labels:
    app.kubernetes.io/name: sdx-edge
    app.kubernetes.io/component: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sdx-prometheus
  labels:
    app.kubernetes.io/name: sdx-edge
    app.kubernetes.io/component: prometheus
rules:
  - verbs:
      - list
      - get
      - watch
    apiGroups:
      - ''
    resources:
      - pods
      - services
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: sdx-prometheus
  labels:
    app.kubernetes.io/name: sdx-edge
    app.kubernetes.io/component: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sdx-prometheus
subjects:
  - kind: ServiceAccount
    name: sdx-prometheus
{{ end }}