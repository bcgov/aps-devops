# Cert Bootstrap Job
# - This job is used to register a new TLS certificate for Kong
# - It runs a container that executes the certificate sign script
{{ if .Values.tls.client.bootstrap.token }}
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include "sdx-edge.fullname" . }}-boot-{{ sha256sum .Values.tls.client.bootstrap.token | trunc 8 }}"
  labels:
    app.kubernetes.io/name: job-cert-bootstrap
    app.kubernetes.io/instance: "{{ include "sdx-edge.fullname" . }}"
    data-plane: "{{ include "sdx-edge.fullname" . }}"
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 0
  manualSelector: false
  ttlSecondsAfterFinished: 604800 # 7 days
  template:
    metadata:
      creationTimestamp: null
    spec:
      restartPolicy: Never
      serviceAccountName: sdx-job-cert-bootstrap
      schedulerName: default-scheduler
      enableServiceLinks: true
      terminationGracePeriodSeconds: 30
      shareProcessNamespace: false
      securityContext: {}
      containers:
        - resources: {}
          terminationMessagePath: /dev/termination-log
          name: cert-bootstrap
          command:
            - /bin/bash
            - +x
            - -e
            - -c
            - |-
                cd /tmp
                export PATH=$PATH:/tmp

                step certificate create \
                  --no-password --insecure \
                  --csr ministryofpuppiesandkittens.xyz tls.csr tls.key

                TOKEN=$(cat /etc/secrets/sdx-edge-bootstrap-token/token)

                step ca sign \
                  --ca-url $CLIENT_CA_URL \
                  --root /etc/secrets/sdx-edge-ca/ca.crt \
                  --force --token $TOKEN tls.csr tls.crt  

                curl -sLO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
                chmod +x kubectl

                kubectl create secret \
                  --save-config --dry-run=client -o yaml \
                  tls ${EDGE_NAME}-client \
                  --cert=./tls.crt \
                  --key=./tls.key | kubectl apply -f -

                kubectl rollout restart deployment $EDGE_NAME

          env:
            - name: EDGE_NAME
              value: "{{ include "sdx-edge.fullname" . }}"
            - name: CLIENT_CA_URL
              value: "{{ .Values.client_ca_url }}"
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: working-dir
              mountPath: /tmp
              mountPropagation: None
            - name: kube-cache
              mountPath: .kube
              mountPropagation: None
            - name: sdx-edge-bootstrap-token
              mountPath: /etc/secrets/sdx-edge-bootstrap-token
            - name: sdx-edge-ca
              mountPath: /etc/secrets/sdx-edge-ca
          image: 'docker.io/smallstep/step-cli:0.23.0'
      automountServiceAccountToken: true
      volumes:
        - name: working-dir
          emptyDir: {}
        - name: kube-cache
          emptyDir: {}
        - name: sdx-edge-bootstrap-token
          secret:
            secretName: {{ include "sdx-edge.fullname" . }}-bootstrap
        - name: sdx-edge-ca
          secret:
            secretName: sdx-edge-ca
      dnsPolicy: ClusterFirst
---
{{ end }}
{{ if .Values.shared.rbac }}
kind: ServiceAccount
apiVersion: v1
metadata:
  name: sdx-job-cert-bootstrap
  labels:
    app.kubernetes.io/name: job-cert-bootstrap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sdx-job-cert-bootstrap
  labels:
    app.kubernetes.io/name: job-cert-bootstrap
rules:
  - verbs:
      - get
      - create
      - patch
    apiGroups:
      - ''
    resources:
      - secrets
  - verbs:
      - get
      - patch
    apiGroups:
      - apps
    resources:
      - deployments
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: sdx-job-cert-bootstrap
  labels:
    app.kubernetes.io/name: job-cert-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sdx-job-cert-bootstrap
subjects:
  - kind: ServiceAccount
    name: sdx-job-cert-bootstrap
{{ end }}