# Cert Bootstrap Job
# - This job is used to register a new TLS certificate for Kong
# - It runs a container that executes the certificate sign script
# - Rendered only while bootstrap.tls.token is set. Clear the token on promote
#   with --set-string bootstrap.tls.token="" (not null; see README) so Helm
#   deletes this Job instead of changing its pod template (stageSecret). Job
#   specs are immutable; a consumed one-time token must not recreate the Job
#   after TTL either.
{{ if .Values.bootstrap.tls.token }}
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include "sdx-edge.fullname" . }}-boot-{{ sha256sum .Values.bootstrap.tls.token | trunc 8 }}"
  labels:
    app.kubernetes.io/name: sdx-edge
    app.kubernetes.io/component: job-cert-bootstrap
    app.kubernetes.io/instance: "{{ include "sdx-edge.fullname" . }}"
    data-plane: "{{ include "sdx-edge.fullname" . }}"
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 0
  manualSelector: false
  ttlSecondsAfterFinished: 604800 # 7 days
  template:
    metadata:
      labels:
        DataClass: Low
        app.kubernetes.io/name: sdx-edge
        app.kubernetes.io/component: job-cert-bootstrap
        app.kubernetes.io/instance: "{{ include "sdx-edge.fullname" . }}"
        data-plane: "{{ include "sdx-edge.fullname" . }}"
    spec:
      restartPolicy: Never
      serviceAccountName: sdx-job-cert-bootstrap
      schedulerName: default-scheduler
      enableServiceLinks: true
      terminationGracePeriodSeconds: 30
      shareProcessNamespace: false
      securityContext: {}
      containers:
        - resources: {}
          terminationMessagePath: /dev/termination-log
          name: cert-bootstrap
          command:
            - /bin/bash
            - +x
            - -e
            - -c
            - |-
                cd /tmp
                export PATH=$PATH:/tmp

                step certificate create \
                  --no-password --insecure \
                   --san ${CN} --san ${IP} \
                  --csr ${CN} tls.csr tls.key

                TOKEN=$(cat /etc/secrets/sdx-edge-bootstrap-token/token)

                curl -kLO "${CLIENT_CA_URL}/roots.pem"

                step ca sign \
                  --ca-url $CLIENT_CA_URL \
                  --root ./roots.pem \
                  --force --token $TOKEN tls.csr tls.crt  

                curl -sLO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
                chmod +x kubectl

{{- if .Values.bootstrap.stageSecret | default false }}
                kubectl create secret \
                  --save-config --dry-run=client -o yaml \
                  tls ${EDGE_NAME}-client-next \
                  --cert=./tls.crt \
                  --key=./tls.key | kubectl apply -f -
{{- else }}
                kubectl delete secret ${EDGE_NAME}-client || true
                kubectl delete secret ${EDGE_NAME}-server || true

                kubectl create secret \
                  --save-config --dry-run=client -o yaml \
                  tls ${EDGE_NAME}-client \
                  --cert=./tls.crt \
                  --key=./tls.key | kubectl apply -f -

                kubectl create secret \
                  --save-config --dry-run=client -o yaml \
                  tls ${EDGE_NAME}-server \
                  --cert=./tls.crt \
                  --key=./tls.key | kubectl apply -f -
{{- end }}

{{- if .Values.shared.ca_secret }}

                kubectl create secret \
                  --save-config --dry-run=client -o yaml \
                  generic sdx-edge-ca \
                  --from-file=ca.crt=./roots.pem | kubectl apply -f -
{{- end }}
{{- if and .Values.kong.enabled (not (.Values.bootstrap.stageSecret | default false)) (not (.Values.bootstrap.deferRestart | default false)) }}
                kubectl rollout restart deployment $EDGE_NAME
{{- end }}

          env:
            - name: CN
              value: "{{ .Values.bootstrap.tls.cn }}"
            - name: IP
              value: "{{ .Values.bootstrap.tls.ip }}"
            - name: EDGE_NAME
              value: "{{ include "sdx-edge.fullname" . }}"
            - name: CLIENT_CA_URL
              value: "{{ index .Values.client_ca_url_by_env .Values.environment }}"
            {{- if .Values.https_proxy }}
            - name: HTTPS_PROXY
              value: "{{ .Values.https_proxy }}"
            - name: NO_PROXY
              value: ".cluster.local,.svc,10.91.0.0/16,10.93.0.0/16,172.30.0.0/16,127.0.0.1,localhost,.gov.bc.ca"
            {{- end }}
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: working-dir
              mountPath: /tmp
              mountPropagation: None
            - name: kube-cache
              mountPath: .kube
              mountPropagation: None
            - name: sdx-edge-bootstrap-token
              mountPath: /etc/secrets/sdx-edge-bootstrap-token
          image: 'docker.io/smallstep/step-cli:0.23.0'
      automountServiceAccountToken: true
      volumes:
        - name: working-dir
          emptyDir: {}
        - name: kube-cache
          emptyDir: {}
        - name: sdx-edge-bootstrap-token
          secret:
            secretName: {{ include "sdx-edge.fullname" . }}-bootstrap
      dnsPolicy: ClusterFirst
---
{{ end }}
{{ if .Values.shared.rbac }}
kind: ServiceAccount
apiVersion: v1
metadata:
  name: sdx-job-cert-bootstrap
  labels:
    app.kubernetes.io/name: sdx-edge
    app.kubernetes.io/component: job-cert-bootstrap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sdx-job-cert-bootstrap
  labels:
    app.kubernetes.io/name: sdx-edge
    app.kubernetes.io/component: job-cert-bootstrap
rules:
  - verbs:
      - get
      - create
      - delete
      - patch
    apiGroups:
      - ''
    resources:
      - secrets
  - verbs:
      - get
      - patch
    apiGroups:
      - apps
    resources:
      - deployments
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: sdx-job-cert-bootstrap
  labels:
    app.kubernetes.io/name: sdx-edge
    app.kubernetes.io/component: job-cert-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sdx-job-cert-bootstrap
subjects:
  - kind: ServiceAccount
    name: sdx-job-cert-bootstrap
{{ end }}