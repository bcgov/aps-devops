{{ if .Values.kong.enabled }}
kind: Secret
apiVersion: v1
metadata:
  name: {{ include "sdx-edge.fullname" . }}-proxy-include
data:
  config: {{ .Values.nginx_conf | b64enc | quote }}
type: Opaque
{{ end }}

{{ if .Values.bootstrap.tls.token }}
---
kind: Secret
apiVersion: v1
metadata:
  name: {{ include "sdx-edge.fullname" . }}-bootstrap
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
data:
  token: {{ .Values.bootstrap.tls.token | b64enc | quote }}
type: Opaque
{{ end }}

{{ if .Values.shared.ca_secret }}
---
kind: Secret
apiVersion: v1
metadata:
  name: sdx-public-ca
data:
  ca.crt: {{ .Values.tls.public_ca | b64enc | quote }}
type: Opaque
{{ end }}

{{ if .Values.aws.enabled }}
---
kind: Secret
apiVersion: v1
metadata:
  name: {{ include "sdx-edge.fullname" . }}-aws
data:
  access_key_id: {{ .Values.aws.access_key_id | b64enc | quote }}
  secret_access_key: {{ .Values.aws.secret_access_key | b64enc | quote }}
type: Opaque
{{ end }}

{{ if .Values.opal.client.enabled }}
---
kind: Secret
apiVersion: v1
metadata:
  name: {{ include "sdx-edge.fullname" . }}-opal-client
data:
  OPAL_CLIENT_TOKEN: {{ .Values.opal.client.token | b64enc | quote }}
type: Opaque
{{ end }}
