{{ if .Values.use_openshift_resources }}
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: sdx-ingress-{{ include "sdx-edge.fullname" . }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sdx-edge
      app.kubernetes.io/component: kong
      app.kubernetes.io/instance: "{{ include "sdx-edge.fullname" . }}"
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports:
      - protocol: TCP
        port: 8443
  policyTypes:
    - Ingress

{{ if .Values.shared.fluentbit.enabled }}
---
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: sdx-edge-to-fluentbit
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sdx-edge
      app.kubernetes.io/component: fluentbit
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sdx-edge
  policyTypes:
    - Ingress
{{ end }}

{{ if .Values.shared.prometheus.enabled }}
---
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: sdx-ingress-prometheus
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sdx-edge
      app.kubernetes.io/component: prometheus
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
  policyTypes:
    - Ingress
{{ end }}
{{ end }}