# Existing standalone Kong configuration with representative Terraform inputs.
replicaCount: 2

updateStrategy:
    rollingUpdate:
        maxSurge: 50%
        maxUnavailable: 50%
    type: RollingUpdate

image:
    pullPolicy: Always
    repository: ghcr.io/bcgov/aps-devops/sdx-access-point
    tag: "v1.0.1"
    effectiveSemver: 3.9.0
    pullSecrets:
    - example-github-read-packages-creds

waitImage:
    pullPolicy: Always
    registry: docker.io
    repository: bash
    tag: "5"

cluster:
  enabled: true
  tls:
    enabled: true
    servicePort: 8005
    containerPort: 8005

admin:
    enabled: true
    type: ClusterIP
    http:
        enabled: true
    tls:
        enabled: false

proxy:
    enabled: false

manager:
    enabled: true
    type: ClusterIP
    http:
        enabled: true
    tls:
        enabled: false

portal:
    enabled: false

portalapi:
    enabled: false

ingressController:
    enabled: false
    installCRDs: false

containerSecurityContext:
  runAsUser: 1000010000
  runAsGroup: 1000010000

migrations:
    preUpgrade: true
    postUpgrade: true
    init: true

resources:
  requests:
    cpu: 50m
    memory: 200Mi
  limits:
    memory: 300Mi

secretVolumes:
- sdx-edge-ca
- sdx-kongh-cluster-cert

env:
    plugins: "bundled, jwt-keycloak_1010, rate-limiting_902, pre-function_770, post-function_200, post-function_201, oidc, oidc-consumer, kong-spec-expose, jwt-keycloak, kong-upstream-jwt, bcgov-gwa-endpoint, gwa-ip-anonymity, mtls-auth, mtls-acl, pep, plugin-log, response-signer, dpop, token-exchange, trust-jwks, trust-kms, trust-ledger, trust-registry, trust-sign, trust-timestamp, trust-verify-digest, trust-verify-signature"
    role: control_plane
    cluster_mtls: pki
    client_ssl_cert: /etc/secrets/sdx-kongh-cluster-cert/tls.crt
    client_ssl_cert_key: /etc/secrets/sdx-kongh-cluster-cert/tls.key
    nginx_proxy_proxy_ssl_certificate: /etc/secrets/sdx-kongh-cluster-cert/ca.crt
    nginx_proxy_proxy_ssl_certificate_key: /etc/secrets/sdx-kongh-cluster-cert/tls.key
    ssl_cert: /etc/secrets/sdx-kongh-cluster-cert/tls.crt
    ssl_cert_key: /etc/secrets/sdx-kongh-cluster-cert/tls.key
    cluster_ca_cert: /etc/secrets/sdx-edge-ca/ca.crt
    cluster_cert: /etc/secrets/sdx-kongh-cluster-cert/tls.crt
    cluster_cert_key: /etc/secrets/sdx-kongh-cluster-cert/tls.key
    lua_ssl_trusted_certificate: /etc/secrets/sdx-edge-ca/ca.crt
    cluster_listen: "0.0.0.0:8005"
    database: postgres
    pg_host: patroni-spilo
    # No pg_ro_host: reads from a lagging Patroni replica send stale config to the DPs.
    pg_database: sdxkongh
    pg_user:
      valueFrom:
        secretKeyRef:
          name: sdx-kong-pg-credentials
          key: pg-user
    pg_password:
      valueFrom:
        secretKeyRef:
          name: sdx-kong-pg-credentials
          key: pg-password

deployment:
    serviceAccount:
      create: false
