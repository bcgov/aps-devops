name: "Publish Backstage Plugins"
description: "Publishes Backstage plugins to the npm registry."
inputs:
  token:
    description: "GitHub token for authentication"
    required: true
  dispatch_repo:
    description: "Optional: The target repository to update (e.g., 'owner/repo-c')"
    required: false
  dispatch_ssh_key:
    description: "Optional: SSH private key with access to the target repository"
    required: false
  dispatch_branch:
    description: "Optional: The branch (ref) in the target repository to commit to. Defaults to 'main'."
    required: false
outputs:
  version:
    description: "The generated release version derived from the root package.json"
    value: ${{ steps.finalize.outputs.version }}
  published_package_versions:
    description: "JSON array of published package names and versions"
    value: ${{ steps.finalize.outputs.published_package_versions }}
  plugin_count:
    description: "Number of plugins published"
    value: ${{ steps.finalize.outputs.plugin_count }}
  target_repo_status:
    description: "The status of the downstream update ('updated', 'no-changes', or 'skipped')"
    value: ${{ steps.dispatch.outputs.status || 'skipped' }}
runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: "22"
        registry-url: "https://registry.npmjs.org"

    - name: Setup Yarn
      shell: bash
      run: corepack enable && corepack prepare yarn@4.4.1 --activate

    - name: Install dependencies
      shell: bash
      run: yarn install

    - name: Generate TypeScript declaration files
      shell: bash
      run: yarn tsc

    - name: Determine release version
      id: version
      shell: bash
      run: |
        set -euo pipefail

        ROOT_VERSION="$(node -p "require('./package.json').version")"
        BASE_VERSION="$(echo "$ROOT_VERSION" | sed 's/-.*//')"
        SHA8="${GITHUB_SHA::8}"

        if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
          IFS='.' read -ra VERSION_PARTS <<< "$BASE_VERSION"
          MAJOR="${VERSION_PARTS[0]}"
          MINOR="${VERSION_PARTS[1]}"
          PATCH="${VERSION_PARTS[2]}"
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}-main.${SHA8}"
        else
          BRANCH_NAME="$(echo "${GITHUB_REF_NAME}" \
            | sed 's/^feature\///' \
            | sed 's/[^a-zA-Z0-9-]/-/g' \
            | tr '[:upper:]' '[:lower:]')"
          BRANCH_NAME="$(echo "$BRANCH_NAME" \
            | sed 's/^-*//' \
            | sed 's/-*$//' \
            | sed 's/-\+/-/g')"
          NEW_VERSION="${BASE_VERSION}-feature.${BRANCH_NAME}.${SHA8}"
        fi

        echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
        echo "Release version: ${NEW_VERSION}"
        

    - name: Discover plugins
      shell: bash
      run: |
        set -euo pipefail

        find plugins -mindepth 1 -maxdepth 1 -type d \
          -exec test -f '{}/package.json' ';' -print \
          | sort > /tmp/plugin-paths.txt

        if [ ! -s /tmp/plugin-paths.txt ]; then
          echo "No plugins found under plugins/"
          exit 1
        fi

        echo "Discovered plugins:"
        while IFS= read -r plugin_path; do
          package_name="$(node -p "require('./${plugin_path}/package.json').name")"
          echo "Found plugin: ${package_name} (${plugin_path})"
        done < /tmp/plugin-paths.txt

    - name: Prepare plugins and create publish plan
      shell: bash
      run: |
        set -euo pipefail

        mkdir -p /tmp/plugin-tarballs
        : > /tmp/publish-plan.txt

        RELEASE_VERSION="${{ steps.version.outputs.version }}"

        while IFS= read -r plugin_path; do
          echo ""
          echo "Preparing $plugin_path"

          package_name="$(node -p "require('./${plugin_path}/package.json').name")"

          echo "Building $plugin_path"
          (
            cd "$plugin_path"
            yarn build
          )

          echo "Updating package.json for $plugin_path"
          (
            cd "$plugin_path"
            npm pkg set version="$RELEASE_VERSION"
            npm pkg delete private
          )

          echo "$plugin_path|$package_name|$RELEASE_VERSION" >> /tmp/publish-plan.txt
        done < /tmp/plugin-paths.txt

        echo ""
        echo "Publish plan:"
        while IFS='|' read -r plugin_path package_name package_version; do
          echo "Planned: ${package_name}@${package_version} (${plugin_path})"
        done < /tmp/publish-plan.txt

    - name: Write release summary
      shell: bash
      run: |
        set -euo pipefail

        {
          echo "## Plugin publish summary"
          echo ""
          echo "- Release version: \`${{ steps.version.outputs.version }}\`"
          echo "- Git ref: \`${GITHUB_REF}\`"
          echo "- Commit: \`${GITHUB_SHA}\`"
          echo ""
          echo "### Planned packages"
          echo ""
          echo "| Package | Version | Path |"
          echo "|---|---|---|"
          while IFS='|' read -r plugin_path package_name package_version; do
            echo "| \`${package_name}\` | \`${package_version}\` | \`${plugin_path}\` |"
          done < /tmp/publish-plan.txt
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Preflight check package versions
      shell: bash
      #env:
      #  NODE_AUTH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail

        # Create temporary config for GitHub authentication
        #echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc

        any_conflicts=0

        while IFS='|' read -r plugin_path package_name package_version; do
          echo ""
          echo "Checking $package_name@$package_version"

          #if npm view "${package_name}@${package_version}" version \
           # --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
           # echo "ERROR: ${package_name}@${package_version} already exists in GitHub Packages"
           # any_conflicts=1
          #elif npm view "${package_name}@${package_version}" \
          if npm view "${package_name}@${package_version}" \
            version >/dev/null 2>&1; then
            echo "ERROR: ${package_name}@${package_version} already exists in npmjs.org"
            any_conflicts=1
          else
            echo "OK: ${package_name}@${package_version} does not exist yet"
          fi
        done < /tmp/publish-plan.txt

        #rm .npmrc

        if [ "$any_conflicts" -ne 0 ]; then
          echo ""
          echo "Preflight failed because one or more package versions already exist."
          exit 1
        fi

    - name: Pack all plugins
      shell: bash
      run: |
        set -euo pipefail

        : > /tmp/publish-tarballs.txt

        while IFS='|' read -r plugin_path package_name package_version; do
          echo ""
          echo "Packing $package_name@$package_version from $plugin_path"

          (
            cd "$plugin_path"
            yarn pack --out /tmp/plugin-tarballs/%s-%v.tgz
          )

          tarball_path="/tmp/plugin-tarballs/${package_name//\//-}-${package_version}.tgz"

          if [ -z "$tarball_path" ] || [ ! -f "$tarball_path" ]; then
            echo "ERROR: Expected tarball not found in /tmp/plugin-tarballs"
            exit 1
          fi

          echo "$plugin_path|$package_name|$package_version|$tarball_path" >> /tmp/publish-tarballs.txt
        done < /tmp/publish-plan.txt

        echo ""
        echo "Tarball plan:"
        while IFS='|' read -r plugin_path package_name package_version tarball_path; do
          echo "Packed: ${package_name}@${package_version} -> ${tarball_path}"
        done < /tmp/publish-tarballs.txt

    # - name: Publish to GitHub Packages
    #   shell: bash
    #   env:
    #     NODE_AUTH_TOKEN: ${{ inputs.token }}
    #   run: |
    #     set -euo pipefail

    #     # Create temporary config for GitHub authentication
    #     echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc

    #     while IFS='|' read -r plugin_path package_name package_version tarball_path; do
    #       echo ""
    #       echo "Publishing $package_name@$package_version to GitHub"
    #       npm publish "$tarball_path" --registry=https://npm.pkg.github.com
    #     done < /tmp/publish-tarballs.txt

    #     rm .npmrc

    - name: Publish to npmjs.org
      shell: bash
      env:
        NPM_CONFIG_PROVENANCE: "true"
      run: |
        set -euo pipefail

        # Diagnostic check for OIDC availability.
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
          echo "::error::ACTIONS_ID_TOKEN_REQUEST_TOKEN is missing. Ensure 'id-token: write' permission is set in the caller workflow job."
        else
          echo "OIDC environment detected."
        fi

        while IFS='|' read -r plugin_path package_name package_version tarball_path; do
          echo ""
          echo "Publishing $package_name@$package_version to npmjs.org"
          
          TAG="latest"
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            TAG="dev"
          fi
          
          # Rely on setup-node config and OIDC fallback
          npm publish "$tarball_path" --access public --tag "$TAG" --provenance --loglevel verbose

        done < /tmp/publish-tarballs.txt

    - name: Finalize outputs
      id: finalize
      shell: bash
      run: |
        set -euo pipefail

        echo "version=${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"
        echo "plugin_count=$(wc -l < /tmp/publish-tarballs.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

        published_package_versions="$(
          node -e "
            const fs = require('fs');
            const lines = fs.readFileSync('/tmp/publish-tarballs.txt', 'utf8')
              .split('\n')
              .filter(Boolean);

            const packages = lines.map(line => {
              const [pluginPath, packageName, packageVersion] = line.split('|');
              return { name: packageName, version: packageVersion, path: pluginPath };
            });

            process.stdout.write(JSON.stringify(packages));
          "
        )"

        echo "published_package_versions=${published_package_versions}" >> "$GITHUB_OUTPUT"

    - name: Write published summary
      if: ${{ success() }}
      shell: bash
      run: |
        set -euo pipefail

        {
          echo ""
          echo "### Published packages"
          echo ""
          echo "| Package | Version |"
          echo "|---|---|"
          while IFS='|' read -r plugin_path package_name package_version tarball_path; do
            echo "| \`${package_name}\` | \`${package_version}\` |"
          done < /tmp/publish-tarballs.txt

          echo ""
          echo "### Install commands"
          echo ""

          while IFS='|' read -r plugin_path package_name package_version tarball_path; do
            echo "\`\`\`bash"
            echo "yarn add ${package_name}@${package_version}"
            echo "\`\`\`"
            echo ""
          done < /tmp/publish-tarballs.txt
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Dispatch via repository commit
      if: ${{ inputs.dispatch_repo != '' && inputs.dispatch_ssh_key != '' && success() }}
      id: dispatch
      shell: bash
      env:
        D_REPO: ${{ inputs.dispatch_repo }}
        D_SSH_KEY: ${{ inputs.dispatch_ssh_key }}
        D_PAYLOAD: ${{ steps.finalize.outputs.published_package_versions }}
        D_BRANCH: ${{ inputs.dispatch_branch || 'main' }}
      run: |
        set -euo pipefail
        echo "Updating dependencies in $D_REPO on ref $D_BRANCH"

        # Setup SSH authentication
        mkdir -p "$HOME/.ssh"
        echo "$D_SSH_KEY" > "$HOME/.ssh/dispatch_key"
        chmod 600 "$HOME/.ssh/dispatch_key"
 
        # Add GitHub to known hosts
        ssh-keyscan github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null || true

        # Export GIT_SSH_COMMAND to use our custom SSH key
        export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/dispatch_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

        # Clone the dispatch repository
        DISPATCH_DIR=$(mktemp -d)
        git clone --branch "$D_BRANCH" --depth 1 "git@github.com:${D_REPO}.git" "$DISPATCH_DIR"
        cd "$DISPATCH_DIR"

        # Configure git user for commits
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"

        # Update dependencies using the published versions
        while IFS= read -r pkg; do
          NAME=$(echo "$pkg" | jq -r '.name')
          VERSION=$(echo "$pkg" | jq -r '.version')
          echo "Updating $NAME to $VERSION"
          yarn up "$NAME@$VERSION" --mode=update-lockfile
        done < <(echo "$D_PAYLOAD" | jq -c '.[]')

        # Commit and push
        if [[ -n $(git status --porcelain) ]]; then
          git add '**/package.json' yarn.lock
          git commit -m "update plugins to version ${{ steps.finalize.outputs.version }}"
          git push origin "$D_BRANCH"
          echo "status=updated" >> "$GITHUB_OUTPUT"
          {
            echo "### Downstream Repository Update"
            echo ""
            echo "Successfully updated target repository: \`${D_REPO}\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
        else
          echo "No changes detected in target repository."
          echo "status=no-changes" >> "$GITHUB_OUTPUT"
          {
            echo "### Downstream Repository Update"
            echo ""
            echo "No changes required for target repository: \`${D_REPO}\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
        fi
        
        # Cleanup
        cd /
        rm -rf "$DISPATCH_DIR"

    - name: Cleanup temp files
      if: ${{ always() }}
      shell: bash
      run: rm -rf /tmp/plugin-*